\<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben TV Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="player.css">
</head>

<body>

<div class="player-page">

  <div class="player-header">
    <button class="back-button" id="back-button">← Back to Guide</button>
    <div class="logo">📺 Ben TV</div>
  </div>

  <div class="player" id="player">
    <div class="message">Loading channel...</div>
  </div>

  <div class="player-info">
    <h1 id="channel-name">Channel</h1>
    <p id="channel-number">Ben TV</p>

    <div class="player-actions">
      <button class="player-action" id="previous-button">◀ Previous</button>
      <button class="player-action" id="next-button">Next ▶</button>
      <button class="player-action" id="favorite-button">☆ Favorite</button>
      <button class="player-action" id="open-button">Open Stream ↗</button>
    </div>
  </div>

</div>

<script>
const channels = [
  {
    number: "101",
    name: "Pluto TV",
    description: "Free Live TV",
    url: "https://pluto.tv/",
    embed: null
  },
  {
    number: "102",
    name: "Tubi",
    description: "Free Streaming",
    url: "https://www.tubi.tv/",
    embed: null
  },
  {
    number: "103",
    name: "YouTube Live",
    description: "Live Streams",
    url: "https://www.youtube.com/",
    embed: null
  },
  {
    number: "104",
    name: "ABC News Live",
    description: "Live News",
    url: "https://www.youtube.com/live/iipR5yUp36o",
    embed: "https://www.youtube.com/embed/iipR5yUp36o?controls=0"
  },
  {
    number: "105",
    name: "NBC News",
    description: "News and Updates",
    url: "https://www.youtube.com/live/HmImKU2D1vM",
    embed: "https://www.youtube.com/embed/HmImKU2D1vM?controls=0"
  },
  {
    number: "106",
    name: "Family Live",
    description: "Family Content",
    url: "https://www.youtube.com/",
    embed: null
  },
  {
    number: "107",
    name: "Phineas and Ferb Season 1",
    description: "Full Episodes",
    url: "https://www.youtube.com/live/_HviSyC7zSU",
    embed: "https://www.youtube.com/embed/_HviSyC7zSU?controls=0"
  },
  {
    number: "108",
    name: "Gravity Falls Season 1",
    description: "Full Episodes",
    url: "https://www.youtube.com/live/eE1L08hNdW8",
    embed: "https://www.youtube.com/embed/eE1L08hNdW8?controls=0"
  },
  {
    number: "109",
    name: "Krabby Patty 24/7 Marathon",
    description: "Live Marathon",
    url: "https://www.youtube.com/live/toD8HbxRjRE",
    embed: "https://www.youtube.com/embed/toD8HbxRjRE?controls=0"
  },
  {
    number: "110",
    name: "FOX News",
    description: "Live News",
    url: "https://www.youtube.com/live/C96oohpWBGw",
    embed: "https://www.youtube.com/embed/C96oohpWBGw?controls=0"
  }
];

const params = new URLSearchParams(window.location.search);
let channelIndex = Number(params.get("channel"));

if (
  Number.isNaN(channelIndex) ||
  channelIndex < 0 ||
  channelIndex >= channels.length
) {
  channelIndex = 0;
}

const player = document.getElementById("player");
const channelName = document.getElementById("channel-name");
const channelNumber = document.getElementById("channel-number");
const backButton = document.getElementById("back-button");
const previousButton = document.getElementById("previous-button");
const nextButton = document.getElementById("next-button");
const favoriteButton = document.getElementById("favorite-button");
const openButton = document.getElementById("open-button");

let favorites = JSON.parse(
  localStorage.getItem("benTVFavorites") || "[]"
);

function loadChannel() {
  const channel = channels[channelIndex];

  channelName.textContent = channel.name;
  channelNumber.textContent =
    "Channel " + channel.number + " • " + channel.description;

  if (channel.embed) {
    player.innerHTML = `
      <iframe
        src="${channel.embed}"
        title="${channel.name}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    `;
  } else {
    player.innerHTML = `
      <div class="message">
        This channel does not have an embedded player yet.
      </div>
    `;
  }

  updateFavoriteButton();

  history.replaceState(
    null,
    "",
    "player.html?channel=" + channelIndex
  );
}

function updateFavoriteButton() {
  const channel = channels[channelIndex];

  if (favorites.includes(channel.url)) {
    favoriteButton.textContent = "★ Favorited";
  } else {
    favoriteButton.textContent = "☆ Favorite";
  }
}

backButton.addEventListener("click", () => {
  window.location.href = "index.html";
});

previousButton.addEventListener("click", () => {
  channelIndex--;

  if (channelIndex < 0) {
    channelIndex = channels.length - 1;
  }

  loadChannel();
});

nextButton.addEventListener("click", () => {
  channelIndex++;

  if (channelIndex >= channels.length) {
    channelIndex = 0;
  }

  loadChannel();
});

favoriteButton.addEventListener("click", () => {
  const channel = channels[channelIndex];

  if (favorites.includes(channel.url)) {
    favorites = favorites.filter(
      item => item !== channel.url
    );
  } else {
    favorites.push(channel.url);
  }

  localStorage.setItem(
    "benTVFavorites",
    JSON.stringify(favorites)
  );

  updateFavoriteButton();
});

openButton.addEventListener("click", () => {
  const channel = channels[channelIndex];

  window.open(channel.url, "_blank");
});

document.addEventListener("keydown", event => {
  if (event.key === "ArrowLeft") {
    previousButton.click();
  }

  if (event.key === "ArrowRight") {
    nextButton.click();
  }

  if (event.key === "Escape") {
    backButton.click();
  }
});

loadChannel();
</script>

</body>
</html>
