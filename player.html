<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben TV Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="player.css">
</head>
<body>
<div class="player-page">
  <header class="player-header">
    <button class="back-button" id="back-button" type="button">← Back to Guide</button>
    <div class="logo">📺 Ben TV</div>
    <div class="player-live"><span></span> LIVE</div>
  </header>

  <div class="player-layout">
    <aside class="channel-sidebar" id="channel-sidebar">
      <div class="sidebar-heading">
        <div>
          <strong>Channels</strong>
          <span id="channel-count">29 channels</span>
        </div>
        <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Close channel list">×</button>
      </div>
      <div class="channel-list" id="channel-list"></div>
    </aside>

    <main class="player-main">
      <div class="player-shell" id="player-shell">
        <div class="player" id="player">
          <div class="message">Loading channel...</div>
        </div>
        <div class="player-overlay">
          <div class="channel-watermark" id="channel-watermark">BEN TV</div>
          <div class="player-status"><span></span> LIVE</div>
          <button class="fullscreen-button" id="fullscreen-button" type="button" aria-label="Enter fullscreen">⛶</button>
        </div>
      </div>

      <div class="player-info">
        <div class="channel-title-row">
          <div>
            <div class="channel-kicker" id="channel-kicker">LIVE CHANNEL</div>
            <h1 id="channel-name">Channel</h1>
            <p id="channel-number">Ben TV</p>
          </div>
          <button class="favorite-big" id="favorite-button" type="button">☆ Favorite</button>
        </div>

        <div class="player-actions">
          <button class="player-action" id="channel-list-button" type="button">☰ Channels</button>
          <button class="player-action" id="previous-button" type="button">◀ Previous</button>
          <button class="player-action" id="next-button" type="button">Next ▶</button>
          <button class="player-action" id="open-button" type="button">Open Stream ↗</button>
          <button class="player-action" id="fullscreen-action" type="button">⛶ Fullscreen</button>
        </div>

        <div class="player-hints">
          <span>← → Change channel</span>
          <span>Esc Back</span>
          <span>F Fullscreen</span>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
const channels = [
  { number:"101", name:"Pluto TV", description:"Free Live TV", url:"https://pluto.tv/", embed:null },
  { number:"102", name:"Tubi", description:"Free Streaming", url:"https://www.tubi.tv/", embed:null },
  { number:"103", name:"YouTube Live", description:"Live Streams", url:"https://www.youtube.com/", embed:null },
  { number:"104", name:"ABC News Live", description:"Live News", url:"https://www.youtube.com/watch?v=iipR5yUp36o", embed:"https://www.youtube.com/embed/iipR5yUp36o?controls=0" },
  { number:"105", name:"NBC News", description:"News and Updates", url:"https://www.youtube.com/watch?v=HmImKU2D1vM", embed:"https://www.youtube.com/embed/HmImKU2D1vM?controls=0" },
  { number:"106", name:"Family Live", description:"Family Content", url:"https://www.youtube.com/", embed:null },
  { number:"107", name:"Phineas and Ferb Season 1", description:"Full Episodes", url:"https://www.youtube.com/watch?v=_HviSyC7zSU", embed:"https://www.youtube.com/embed/_HviSyC7zSU?controls=0" },
  { number:"108", name:"Gravity Falls Season 1", description:"Full Episodes", url:"https://www.youtube.com/watch?v=eE1L08hNdW8", embed:"https://www.youtube.com/embed/eE1L08hNdW8?controls=0" },
  { number:"109", name:"Krabby Patty 24/7 Marathon", description:"Live Marathon", url:"https://www.youtube.com/watch?v=toD8HbxRjRE", embed:"https://www.youtube.com/embed/toD8HbxRjRE?controls=0" },
  { number:"110", name:"FOX News / LiveNOW FOX", description:"Live News", url:"https://www.youtube.com/watch?v=C96oohpWBGw", embed:"https://www.youtube.com/embed/C96oohpWBGw?controls=0" },
  { number:"111", name:"Sky News", description:"International News", url:"https://www.youtube.com/watch?v=YDvsBbKfLPA", embed:"https://www.youtube.com/embed/YDvsBbKfLPA?controls=0" },
  { number:"112", name:"CNBC News", description:"Business News", url:"https://www.youtube.com/watch?v=9NyxcX3rhQs", embed:"https://www.youtube.com/embed/9NyxcX3rhQs?controls=0" },
  { number:"113", name:"CBC News", description:"Canadian News", url:"https://www.youtube.com/watch?v=5vfaDsMhCF4", embed:"https://www.youtube.com/embed/5vfaDsMhCF4?controls=0" },
  { number:"114", name:"Scripps News", description:"Live News", url:"https://www.youtube.com/watch?v=R4Bc6SFzGtM", embed:"https://www.youtube.com/embed/R4Bc6SFzGtM?controls=0" },
  { number:"115", name:"Bloomberg Business", description:"Business News", url:"https://www.youtube.com/watch?v=iEpJwprxDdk", embed:"https://www.youtube.com/embed/iEpJwprxDdk?controls=0" },
  { number:"116", name:"Yahoo Finance", description:"Finance News", url:"https://www.youtube.com/watch?v=KQp-e_XQnDE", embed:"https://www.youtube.com/embed/KQp-e_XQnDE?controls=0" },
  { number:"117", name:"FOX Weather", description:"Live Weather", url:"https://www.youtube.com/watch?v=wt6SIE7BXS8", embed:"https://www.youtube.com/embed/wt6SIE7BXS8?controls=0" },
  { number:"118", name:"The Lord of the Rings", description:"Movie Marathon", url:"https://www.youtube.com/watch?v=G43NInZfoPE", embed:"https://www.youtube.com/embed/G43NInZfoPE?controls=0" },
  { number:"119", name:"Harry Potter", description:"Movie Marathon", url:"https://www.youtube.com/watch?v=WVwP298MU7I", embed:"https://www.youtube.com/embed/WVwP298MU7I?controls=0" },
  { number:"120", name:"The Office US", description:"Comedy Marathon", url:"https://www.youtube.com/watch?v=AJmaVPfyudQ", embed:"https://www.youtube.com/embed/AJmaVPfyudQ?controls=0" },
  { number:"121", name:"Mr. Bean", description:"Comedy", url:"https://www.youtube.com/watch?v=aYco1VpAoWc", embed:"https://www.youtube.com/embed/aYco1VpAoWc?controls=0" },
  { number:"122", name:"Chocolate Sundaes Comedy", description:"Comedy Entertainment", url:"https://www.youtube.com/watch?v=37-X4eYGOFY", embed:"https://www.youtube.com/embed/37-X4eYGOFY?controls=0" },
  { number:"123", name:"WW2 In Colour", description:"History & Entertainment", url:"https://www.youtube.com/watch?v=imQGaX_ZdiI", embed:"https://www.youtube.com/embed/imQGaX_ZdiI?controls=0" },
  { number:"124", name:"Marvel's Avengers", description:"Kids & Animation", url:"https://www.youtube.com/watch?v=hNf5__nxw5s", embed:"https://www.youtube.com/embed/hNf5__nxw5s?controls=0" },
  { number:"125", name:"Ultimate Spider-Man", description:"Kids & Animation", url:"https://www.youtube.com/watch?v=2PzfL3zrE-o", embed:"https://www.youtube.com/embed/2PzfL3zrE-o?controls=0" },
  { number:"126", name:"Lilo & Stitch", description:"Kids & Animation", url:"https://www.youtube.com/watch?v=F4Tnje7wi-o", embed:"https://www.youtube.com/embed/F4Tnje7wi-o?controls=0" },
  { number:"127", name:"Mickey Mouse", description:"Kids & Animation", url:"https://www.youtube.com/watch?v=yHmPWzkhcZ8", embed:"https://www.youtube.com/embed/yHmPWzkhcZ8?controls=0" },
  { number:"128", name:"Pixar Cars", description:"Kids & Animation", url:"https://www.youtube.com/watch?v=yzKTO-6KWHU", embed:"https://www.youtube.com/embed/yzKTO-6KWHU?controls=0" },
  { number:"129", name:"Wizards of Waverly Place", description:"Kids & Family", url:"https://www.youtube.com/watch?v=s1Ylmj87gXY", embed:"https://www.youtube.com/embed/s1Ylmj87gXY?controls=0" },
  { number:"130", name:"Disney Kids Original Series", description:"Kids & Family", url:"https://www.youtube.com/watch?v=2MC5ltEDu7w", embed:"https://www.youtube.com/embed/2MC5ltEDu7w?controls=0" },
  { number:"131", name:"Philadelphia NBC10", description:"Local News", url:"https://www.youtube.com/watch?v=BbCxHt5vUik", embed:"https://www.youtube.com/embed/BbCxHt5vUik?controls=0" },
  { number:"132", name:"Philadelphia FOX", description:"Local News", url:"https://www.youtube.com/watch?v=Yo5G6C9Qex8", embed:"https://www.youtube.com/embed/Yo5G6C9Qex8?controls=0" },
  { number:"133", name:"San Francisco Local News", description:"Local News", url:"https://www.youtube.com/watch?v=rM8rkzxKZRs", embed:"https://www.youtube.com/embed/rM8rkzxKZRs?controls=0" }
].filter(channel => !["NBC News", "Scripps News", "Bloomberg Business", "Mr. Bean"].includes(channel.name))
 .map((channel, index) => ({ ...channel, number: String(101 + index) }));

const params = new URLSearchParams(location.search);
let channelIndex = Number(params.get("channel"));
if (!Number.isInteger(channelIndex) || channelIndex < 0 || channelIndex >= channels.length) channelIndex = 0;

const playerShell = document.getElementById("player-shell");
const player = document.getElementById("player");
const channelName = document.getElementById("channel-name");
const channelNumber = document.getElementById("channel-number");
const channelKicker = document.getElementById("channel-kicker");
const watermark = document.getElementById("channel-watermark");
const channelList = document.getElementById("channel-list");
const channelSidebar = document.getElementById("channel-sidebar");
const channelCount = document.getElementById("channel-count");
const backButton = document.getElementById("back-button");
const previousButton = document.getElementById("previous-button");
const nextButton = document.getElementById("next-button");
const favoriteButton = document.getElementById("favorite-button");
const openButton = document.getElementById("open-button");
const channelListButton = document.getElementById("channel-list-button");
const sidebarClose = document.getElementById("sidebar-close");
const fullscreenButton = document.getElementById("fullscreen-button");
const fullscreenAction = document.getElementById("fullscreen-action");

let favorites = JSON.parse(localStorage.getItem("benTVFavorites") || "[]");
channelCount.textContent = `${channels.length} channels`;

function buildChannelList() {
  channelList.innerHTML = "";
  channels.forEach((channel, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "channel-list-item";
    button.dataset.index = index;
    button.innerHTML = `<span class="mini-number">${channel.number}</span><span class="mini-name">${channel.name}</span><span class="mini-live">LIVE</span>`;
    button.addEventListener("click", () => {
      channelIndex = index;
      loadChannel();
    });
    channelList.appendChild(button);
  });
}

function updateChannelList() {
  document.querySelectorAll(".channel-list-item").forEach(item => {
    item.classList.toggle("active", Number(item.dataset.index) === channelIndex);
  });
}

function loadChannel() {
  const channel = channels[channelIndex];
  playerShell.classList.remove("channel-changing");
  void playerShell.offsetWidth;
  playerShell.classList.add("channel-changing");

  channelName.textContent = channel.name;
  channelNumber.textContent = `Channel ${channel.number} • ${channel.description}`;
  channelKicker.textContent = `CHANNEL ${channel.number}`;
  watermark.textContent = channel.name;

  if (channel.embed) {
    player.innerHTML = `<iframe src="${channel.embed}" title="${channel.name}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
  } else {
    player.innerHTML = `<div class="message"><strong>${channel.name}</strong><span>Embedded playback isn't available for this channel.</span><button type="button" id="message-open">Open Stream ↗</button></div>`;
    document.getElementById("message-open").addEventListener("click", openCurrentStream);
  }

  updateFavoriteButton();
  updateChannelList();
  history.replaceState(null, "", `player.html?channel=${channelIndex}`);
  document.title = `${channel.name} • Ben TV`;
  setTimeout(() => playerShell.classList.remove("channel-changing"), 300);
}

function updateFavoriteButton() {
  const favorite = favorites.includes(channels[channelIndex].url);
  favoriteButton.textContent = favorite ? "★ Favorited" : "☆ Favorite";
  favoriteButton.setAttribute("aria-pressed", String(favorite));
}

function openCurrentStream() {
  window.open(channels[channelIndex].url, "_blank", "noopener,noreferrer");
}

function toggleSidebar(force) {
  const open = force === undefined ? !channelSidebar.classList.contains("open") : force;
  channelSidebar.classList.toggle("open", open);
}

async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await playerShell.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.warn("Fullscreen unavailable", error);
  }
}

backButton.addEventListener("click", () => {
  sessionStorage.setItem("benTVReturnFromPlayer", "1");
  location.href = "index.html";
});

previousButton.addEventListener("click", () => {
  channelIndex = (channelIndex - 1 + channels.length) % channels.length;
  loadChannel();
});

nextButton.addEventListener("click", () => {
  channelIndex = (channelIndex + 1) % channels.length;
  loadChannel();
});

favoriteButton.addEventListener("click", () => {
  const url = channels[channelIndex].url;
  if (favorites.includes(url)) favorites = favorites.filter(item => item !== url);
  else favorites.push(url);
  localStorage.setItem("benTVFavorites", JSON.stringify(favorites));
  updateFavoriteButton();
});

openButton.addEventListener("click", openCurrentStream);
channelListButton.addEventListener("click", () => toggleSidebar());
sidebarClose.addEventListener("click", () => toggleSidebar(false));
fullscreenButton.addEventListener("click", toggleFullscreen);
fullscreenAction.addEventListener("click", toggleFullscreen);

document.addEventListener("fullscreenchange", () => {
  fullscreenAction.textContent = document.fullscreenElement ? "⛶ Exit Fullscreen" : "⛶ Fullscreen";
});

document.addEventListener("keydown", event => {
  if (event.target.matches("input, textarea, button")) return;
  if (event.key === "ArrowLeft") previousButton.click();
  if (event.key === "ArrowRight") nextButton.click();
  if (event.key === "Escape" && channelSidebar.classList.contains("open")) {
    toggleSidebar(false);
    return;
  }
  if (event.key === "Escape") backButton.click();
  if (event.key.toLowerCase() === "f") toggleFullscreen();
});

buildChannelList();
loadChannel();
</script>
</body>
</html>
