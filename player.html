<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben TV Player</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      padding: 20px;
    }

    .player-page {
      max-width: 1200px;
      margin: 0 auto;
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .back-button,
    .player-action {
      border: none;
      background: #1b1b23;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back-button:hover,
    .player-action:hover {
      background: #292933;
    }

    .player {
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .player iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .player-info {
      margin-top: 20px;
      background: #17171e;
      border-radius: 16px;
      padding: 22px;
    }

    .player-info h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .player-info p {
      margin: 0;
      opacity: 0.65;
    }

    .player-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .message {
      padding: 40px;
      text-align: center;
      color: #aaa;
    }

    @media (max-width: 700px) {
      .player-header {
        flex-direction: column;
        align-items: stretch;
      }

      .player-header .back-button {
        width: 100%;
      }

      .player-info h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="player-page">

    <div class="player-header">
      <button class="back-button" id="back-button">← Back to Guide</button>
      <div class="logo">📺 Ben TV</div>
    </div>

    <div class="player" id="player">
      <div class="message">Loading channel...</div>
    </div>

    <div class="player-info">
      <h1 id="channel-name">Channel</h1>
      <p id="channel-number">Ben TV</p>

      <div class="player-actions">
        <button class="player-action" id="previous-button">◀ Previous</button>
        <button class="player-action" id="next-button">Next ▶</button>
        <button class="player-action" id="favorite-button">☆ Favorite</button>
        <button class="player-action" id="open-button">Open Stream ↗</button>
      </div>
    </div>

  </div>

  <script>
    const channels = [
      {
        number: "101",
        name: "Pluto TV",
        url: "https://pluto.tv/"
      },
      {
        number: "102",
        name: "Tubi",
        url: "https://www.tubi.tv/"
      },
      {
        number: "103",
        name: "YouTube Live",
        url: "https://www.youtube.com/"
      },
      {
        number: "104",
        name: "ABC News Live",
        url: "https://www.youtube.com/live/iipR5yUp36o?si=6mTUVLb88W6ZW805"
      },
      {
        number: "105",
        name: "NBC News",
        url: "https://www.youtube.com/live/HmImKU2D1vM?si=AwpNH4sUGfJ5usy4"
      },
      {
        number: "106",
        name: "Family Live",
        url: "https://www.youtube.com/"
      },
      {
        number: "107",
        name: "Phineas and Ferb Season 1",
        url: "https://www.youtube.com/live/_HviSyC7zSU?si=1TXOJmzU4jPDu4-_"
      },
      {
        number: "108",
        name: "Gravity Falls Season 1",
        url: "https://www.youtube.com/live/eE1L08hNdW8?si=qmOlkUCORex_jLyj"
      },
      {
        number: "109",
        name: "Krabby Patty 24/7 Marathon",
        url: "https://www.youtube.com/live/toD8HbxRjRE?si=-zLzfDHgcPMTqBtk"
      },
      {
        number: "110",
        name: "FOX News",
        url: "https://www.youtube.com/live/C96oohpWBGw?si=Rpf7MrWZpXZDYd1G"
      }
    ];

    const params = new URLSearchParams(window.location.search);

    let currentIndex = Number(params.get("channel"));

    if (
      !Number.isInteger(currentIndex) ||
      currentIndex < 0 ||
      currentIndex >= channels.length
    ) {
      currentIndex = 0;
    }

    const player = document.getElementById("player");
    const channelName = document.getElementById("channel-name");
    const channelNumber = document.getElementById("channel-number");
    const favoriteButton = document.getElementById("favorite-button");

    function getYouTubeId(url) {
      const match = url.match(
        /youtube\.com\/(?:live\/|watch\?v=)([^?&/]+)/
      );

      return match ? match[1] : null;
    }

    function updateFavorite() {
      const favorites =
        JSON.parse(localStorage.getItem("benTVFavorites")) || [];

      const isFavorite =
        favorites.includes(channels[currentIndex].url);

      favoriteButton.textContent =
        isFavorite ? "★ Favorited" : "☆ Favorite";
    }

    function loadChannel() {
      const channel = channels[currentIndex];
      const videoId = getYouTubeId(channel.url);

      channelName.textContent = channel.name;
      channelNumber.textContent =
        "Channel " + channel.number;

      if (videoId) {
        player.innerHTML =
          '<iframe src="https://www.youtube.com/embed/' +
          videoId +
          '?autoplay=1&rel=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
      } else {
        player.innerHTML =
          '<div class="message">This channel cannot be embedded here.<br><br>Use Open Stream to watch it.</div>';
      }

      updateFavorite();

      history.replaceState(
        null,
        "",
        "?channel=" + currentIndex
      );
    }

    document
      .getElementById("back-button")
      .addEventListener("click", function() {
        window.location.href = "index.html";
      });

    document
      .getElementById("previous-button")
      .addEventListener("click", function() {
        currentIndex =
          (currentIndex - 1 + channels.length) %
          channels.length;

        loadChannel();
      });

    document
      .getElementById("next-button")
      .addEventListener("click", function() {
        currentIndex =
          (currentIndex + 1) % channels.length;

        loadChannel();
      });

    favoriteButton.addEventListener("click", function() {
      const channel = channels[currentIndex];

      let favorites =
        JSON.parse(localStorage.getItem("benTVFavorites")) || [];

      if (favorites.includes(channel.url)) {
        favorites = favorites.filter(
          url => url !== channel.url
        );
      } else {
        favorites.push(channel.url);
      }

      localStorage.setItem(
        "benTVFavorites",
        JSON.stringify(favorites)
      );

      updateFavorite();
    });

    document
      .getElementById("open-button")
      .addEventListener("click", function() {
        window.open(
          channels[currentIndex].url,
          "_blank"
        );
      });

    document.addEventListener("keydown", function(event) {
      if (event.key === "ArrowLeft") {
        document
          .getElementById("previous-button")
          .click();
      }

      if (event.key === "ArrowRight") {
        document
          .getElementById("next-button")
          .click();
      }

      if (event.key === "Escape") {
        window.location.href = "index.html";
      }
    });

    loadChannel();
  </script>
</body>
</html>
