<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben TV</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="logo">📺 Ben TV</div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <h2>What do you want to watch?</h2>

  <div class="row">
    <div class="card" tabindex="0" id="youtube-button">▶ YouTube</div>
    <div class="card" tabindex="0" id="movies-button">🎬 Movies</div>
    <div class="card" tabindex="0" id="favorites-button">⭐ Favorites</div>
  </div>

  <section class="tv-guide">
    <div class="guide-header">
      <h2>📡 Live TV</h2>
      <div class="now-playing">
        <span>NOW PLAYING</span>
        <strong>Live Channel Guide</strong>
      </div>
    </div>

    <div class="channel-grid">
      <div class="channel-card" tabindex="0" data-url="https://pluto.tv/">
        <div class="channel-number">101</div>
        <div class="channel-icon">🪐</div>
        <div class="channel-info">
          <h3>Pluto TV</h3>
          <p>Free Live TV</p>
        </div>
        <div class="watch">WATCH ▶</div>
      </div>

      <div class="channel-card" tabindex="0" data-url="https://www.tubi.tv/">
        <div class="channel-number">102</div>
        <div class="channel-icon">🟠</div>
        <div class="channel-info">
          <h3>Tubi</h3>
          <p>Free Streaming</p>
        </div>
        <div class="watch">WATCH ▶</div>
      </div>

      <div class="channel-card" tabindex="0" data-url="https://www.youtube.com/">
        <div class="channel-number">103</div>
        <div class="channel-icon">▶️</div>
        <div class="channel-info">
          <h3>YouTube Live</h3>
          <p>Live Streams</p>
        </div>
        <div class="watch">WATCH ▶</div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
