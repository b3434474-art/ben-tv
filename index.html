<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben TV</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="logo">📺 Ben TV</div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <h2>What do you want to watch?</h2>

  <div class="row">
    <div class="card" tabindex="0">▶ YouTube</div>
    <div class="card" tabindex="0">📡 Live TV</div>
    <div class="card" tabindex="0">🎬 Movies</div>
    <div class="card" tabindex="0">⭐ Favorites</div>
  </div>

  <h2>📡 Live TV</h2>

  <div class="row">
    <div class="card channel" tabindex="0" data-url="https://pluto.tv/">
      Pluto TV
    </div>

    <div class="card channel" tabindex="0" data-url="https://www.tubi.tv/">
      Tubi
    </div>

    <div class="card channel" tabindex="0" data-url="https://www.youtube.com/">
      YouTube Live
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
